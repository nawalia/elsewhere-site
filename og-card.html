<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="robots" content="noindex"><link rel="stylesheet" href="/style.css">
<style>
  body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: #0a0a0c; }
  .og { position: relative; width: 1200px; height: 630px; padding: 64px 72px; box-sizing: border-box; background-image: radial-gradient(rgba(255,255,255,0.06) 1px, transparent 1.2px); background-size: 28px 28px; }
  .og h1 { font-size: 132px; margin: 70px 0 0; line-height: .88; }
  .og h1 .line > span { transform: none; }
  .og .brand { font-size: 26px; }
  .og .brand .mark { width: 38px; height: 38px; border-radius: 10px; }
  .og .brand .mark svg { width: 19px; height: 28px; }
  .og p { position: absolute; left: 72px; bottom: 60px; margin: 0; color: #a9a9b2; font-size: 26px; font-weight: 400; }
  .og svg.pin { position: absolute; right: 90px; top: 120px; width: 300px; }
</style></head><body>

</div>
</body></html>
